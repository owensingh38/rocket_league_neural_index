[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rocket-league-neural-index"
version = "0.0.1"
description = "Fine-Grained Evaluation of Human Gameplay Behaviours in Rocket League"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["lgps", "xg", "inference"]
py-modules = ["props"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
